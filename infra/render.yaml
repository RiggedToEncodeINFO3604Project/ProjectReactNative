services:
  - type: web
    name: skeduleit-front
    runtime: docker
    dockerfilePath: ./apps/frontend/Dockerfile
    healthCheckPath: /health

  - type: web
    name: skeduleit
    runtime: docker
    dockerfilePath: ./apps/scheduling-service/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:8081,http://localhost:19000,http://localhost:19006,https://skeduleit-front.onrender.com

  - type: web
    name: skeduleit-messaging
    runtime: docker
    dockerfilePath: ./apps/messaging-service/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:8081,http://localhost:19000,http://localhost:19006,https://skeduleit-front.onrender.com

  - type: web
    name: skeduleit-snapshots
    runtime: docker
    dockerfilePath: ./apps/snapshot-service/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:8081,http://localhost:19000,http://localhost:19006,https://skeduleit-front.onrender.com

  - type: web
    name: skeduleit-rag
    runtime: docker
    dockerfilePath: ./apps/rag-service/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:8081,http://localhost:19000,http://localhost:19006,https://skeduleit-front.onrender.com
