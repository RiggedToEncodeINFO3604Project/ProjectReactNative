services:
  # Combined Frontend + Backend Service
  # Runs the frontend, API, and RAG service in a single container
  - type: web
    name: expo-scheduling
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    # Health check verifies the Express proxy plus both internal services.
    healthCheckPath: /health
    envVars:
      # Leave blank so the web build uses the same-origin Render URL.
      - key: EXPO_PUBLIC_API_URL
        value: ""

      # Firebase admin credentials for the FastAPI backend.
      - key: FIREBASE_CREDENTIALS
        sync: false

      # Firebase web config for the Expo frontend.
      - key: EXPO_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_DATABASE_URL
        sync: false

      # Gemini API for the local RAG service.
      - key: GEMINI_API_KEY
        sync: false

      - key: NODE_ENV
        value: production
