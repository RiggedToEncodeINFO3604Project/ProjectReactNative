version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: apps/expo-frontend/Dockerfile
      args:
        EXPO_PUBLIC_FRONTEND_URL: http://localhost:8081
        EXPO_PUBLIC_API_URL: http://localhost:8000
        EXPO_PUBLIC_SCHEDULING_URL: http://localhost:8000
        EXPO_PUBLIC_MESSAGING_URL: http://localhost:8002
        EXPO_PUBLIC_SNAPSHOT_URL: http://localhost:8003
        EXPO_PUBLIC_RAG_URL: http://localhost:8001
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
    restart: unless-stopped

  scheduling:
    build:
      context: .
      dockerfile: apps/scheduling-service/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      ALLOWED_ORIGINS: http://localhost:8081,http://localhost:19000,http://localhost:19006,https://skeduleit-front.onrender.com
    restart: unless-stopped

  messaging:
    build:
      context: .
      dockerfile: apps/messaging-service/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      ALLOWED_ORIGINS: http://localhost:8081,http://localhost:19000,http://localhost:19006,https://skeduleit-front.onrender.com
    restart: unless-stopped

  snapshot:
    build:
      context: .
      dockerfile: apps/snapshot-service/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      ALLOWED_ORIGINS: http://localhost:8081,http://localhost:19000,http://localhost:19006,https://skeduleit-front.onrender.com
    restart: unless-stopped

  rag:
    build:
      context: .
      dockerfile: apps/rag-service/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      ALLOWED_ORIGINS: http://localhost:8081,http://localhost:19000,http://localhost:19006,https://skeduleit-front.onrender.com
    restart: unless-stopped
